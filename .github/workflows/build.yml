name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags with_utls ./host
      - run: go test -tags with_utls ./host
      - name: Syntax of extension scripts
        run: for f in extension/*.js; do node --check "$f"; done

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, out: VPN-Terminal-Setup-windows-x64.exe, ldflags: "-H=windowsgui" }
          - { goos: windows, goarch: arm64, out: VPN-Terminal-Setup-windows-arm64.exe, ldflags: "-H=windowsgui" }
          - { goos: linux, goarch: amd64, out: vpn-terminal-linux-x64, ldflags: "" }
          - { goos: darwin, goarch: arm64, out: vpn-terminal-macos-arm64, ldflags: "" }
          - { goos: darwin, goarch: amd64, out: vpn-terminal-macos-x64, ldflags: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VER="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="v2.0.${{ github.run_number }}"; fi
          go build -trimpath -tags with_utls -ldflags "-s -w ${{ matrix.ldflags }} -X main.version=${VER}" -o "dist/${{ matrix.out }}" ./host
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  # Релиз публикуется на каждый push в main (тег v2.0.<номер запуска>) и на любой вручную запущенный тег v*.
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v2.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: VPN Terminal ${{ github.ref_type == 'tag' && github.ref_name || format('v2.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: dist/*
