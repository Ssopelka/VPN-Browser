name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags with_utls ./host
      - run: go test -tags with_utls ./host
      - name: Syntax of extension scripts
        run: for f in extension/*.js; do node --check "$f"; done

  extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package for Chrome Web Store
        run: |
          mkdir -p dist /tmp/ext
          cp -r extension/. /tmp/ext/
          jq 'del(.key)' extension/manifest.json > /tmp/ext/manifest.json
          (cd /tmp/ext && zip -r -q "$GITHUB_WORKSPACE/dist/vpn-terminal-extension-store.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: vpn-terminal-extension-store.zip
          path: dist/vpn-terminal-extension-store.zip

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, out: VPN-Terminal-Setup-windows-x64.exe, ldflags: "-H=windowsgui" }
          - { goos: windows, goarch: arm64, out: VPN-Terminal-Setup-windows-arm64.exe, ldflags: "-H=windowsgui" }
          - { goos: linux, goarch: amd64, out: vpn-terminal-linux-x64, ldflags: "" }
          - { goos: darwin, goarch: arm64, out: vpn-terminal-macos-arm64, ldflags: "" }
          - { goos: darwin, goarch: amd64, out: vpn-terminal-macos-x64, ldflags: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Windows icon
        if: matrix.goos == 'windows'
        run: |
          python3 tools/mkico.py app.ico extension/icons/icon16.png extension/icons/icon32.png extension/icons/icon48.png extension/icons/icon128.png
          go run github.com/akavel/rsrc@v0.10.2 -ico app.ico -arch ${{ matrix.goarch }} -o host/rsrc_windows_${{ matrix.goarch }}.syso
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VER="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VER="v2.0.${{ github.run_number }}"; fi
          go build -trimpath -tags with_utls -ldflags "-s -w ${{ matrix.ldflags }} -X main.version=${VER} -X main.storeID=${{ vars.STORE_EXTENSION_ID }}" -o "dist/${{ matrix.out }}" ./host
      - name: Sign
        if: matrix.goos == 'windows' && env.WIN_CERT != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          echo "$WIN_CERT" | base64 -d > cert.pfx
          osslsigncode sign -pkcs12 cert.pfx -pass "$WIN_CERT_PASSWORD" -n "VPN Terminal" -h sha256 -t http://timestamp.digicert.com -in "dist/${{ matrix.out }}" -out dist/signed.exe
          mv dist/signed.exe "dist/${{ matrix.out }}"
          rm cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  # Релиз публикуется на каждый push в main (тег v2.0.<номер запуска>) и на любой вручную запущенный тег v*.
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v2.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: VPN Terminal ${{ github.ref_type == 'tag' && github.ref_name || format('v2.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: dist/*
